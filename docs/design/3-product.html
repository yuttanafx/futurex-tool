<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>หน้าสินค้า</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;700&amp;display=swap"><style>body{margin:0}a{color:inherit;text-decoration:none}</style></head><body>
<div style="font-family:IBM Plex Sans Thai,sans-serif;min-height:760px;box-sizing:border-box;background:#F4F7F9;color:#12303D">
<div style="background:#fff;border-bottom:1px solid rgba(18,48,61,.1)"><div style="max-width:1000px;margin:0 auto;padding:18px 32px;display:flex;justify-content:space-between;align-items:center"><strong style="font-size:18px">[ชื่อร้าน]</strong><div style="display:flex;gap:24px;font-size:14px"><a href="#">หน้าร้าน</a><a href="#">ติดต่อผู้ขาย</a></div></div></div>
<div style="max-width:1000px;margin:0 auto;padding:36px 32px"><a href="#" style="font-size:14px;color:#0B6B57;text-decoration:underline">← กลับหน้าร้าน</a>
<div style="display:flex;gap:40px;margin-top:22px;flex-wrap:wrap">

<div style="flex:1 1 380px"><h1 style="margin:0;font-size:30px">[ชื่อสินค้า]</h1><div style="margin-top:8px;font-size:28px;color:#0B6B57;font-weight:700">฿[ราคา]</div>
<p style="margin:16px 0 0;line-height:1.7;color:rgba(18,48,61,.82)">[รายละเอียดสินค้าที่สมาชิกกรอกจากหลังบ้าน]</p>
<div style="margin-top:22px;background:#fff;border:1px solid rgba(18,48,61,.1);border-radius:14px;padding:20px;display:grid;gap:10px">
<label style="font-size:14px">จำนวน<input value="1" style="display:block;margin-top:4px;width:90px;box-sizing:border-box;border:1px solid rgba(18,48,61,.25);border-radius:8px;padding:10px 12px;font:inherit"></label>
<input placeholder="ชื่อผู้สั่ง" aria-label="ชื่อผู้สั่ง" style="border:1px solid rgba(18,48,61,.25);border-radius:8px;padding:10px 12px;font:inherit"><input placeholder="เบอร์โทร" aria-label="เบอร์โทร" style="border:1px solid rgba(18,48,61,.25);border-radius:8px;padding:10px 12px;font:inherit">
<button style="background:#0B6B57;color:#fff;border:0;border-radius:8px;padding:13px;font:inherit;font-weight:500">สั่งซื้อ</button></div></div></div></div></div>
